    <!-- ══ 社交分享卡片 ═══════════════════════════════════════════
         微信 / 朋友圈 / 微博 / QQ 抓的都是这一组标签。
         缺了它们，链接分享出去只有一条干巴巴的文字，没有图和摘要 ——
         对靠作品说话的摄影站来说，这是最大的传播损失。
         ⚠️ og:image 与 og:url 必须是【完整绝对 URL】，社交平台不解析相对路径。
            拿到域名后，把下面的 https://example.com 全部换成你的真实域名。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LINSHEN.STUDIO" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="LINSHEN.STUDIO · 独立摄影师 | 人像 · 婚礼 · 商业摄影" />
    <meta
      property="og:description"
      content="十二年婚礼纪实、人像写真与商业摄影。用一支镜头，替你保存再也回不去的瞬间。"
    />
    <meta property="og:image" content="https://example.com/images/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="婚礼纪实作品：树林中并肩站立的新人" />
    <meta property="og:url" content="https://example.com/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LINSHEN.STUDIO · 独立摄影师" />
    <meta
      name="twitter:description"
      content="十二年婚礼纪实、人像写真与商业摄影。用一支镜头，替你保存再也回不去的瞬间。"
    />
    <meta name="twitter:image" content="https://example.com/images/og-cover.jpg" />
